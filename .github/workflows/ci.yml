name: CI

# One job on purpose: GitHub bills every job rounded up to a whole minute. While the repo is
# private these minutes come out of the shared Actions quota.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 is required by gitleaks, which scans the whole history.
      # persist-credentials: false keeps the token out of .git/config, away from the binary below.
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Dependabot can't see this pin: bump the version and its SHA-256 (from the release's
      # checksums.txt) by hand.
      - name: Install gitleaks
        run: |
          curl -sSLo gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          rm gitleaks.tar.gz

      - name: Run gitleaks
        run: gitleaks detect --redact
