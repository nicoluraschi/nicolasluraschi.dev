name: CI

# One job on purpose: GitHub bills every job rounded up to a whole minute. While the repo is
# private these minutes come out of the shared Actions quota.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    # Caps a hung step (browser, apt, an unresponsive external host) well below the 6h default.
    timeout-minutes: 15
    steps:
      # fetch-depth: 0 is required by gitleaks, which scans the whole history.
      # persist-credentials: false keeps the token out of .git/config, away from the binary below.
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Dependabot can't see this pin: bump the version and its SHA-256 (from the release's
      # checksums.txt) by hand.
      - name: Install gitleaks
        run: |
          curl -sSLo gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          rm gitleaks.tar.gz

      - name: Run gitleaks
        run: gitleaks detect --redact

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # --ignore-scripts: no dependency runs code at install time.
      - name: Install Node dependencies
        run: npm ci --ignore-scripts

      # A venv because the runner's system Python refuses pip installs (PEP 668).
      - name: Install Python dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --require-hashes -r requirements-dev.txt

      # Keyed on the installed Playwright version, not the whole lockfile; no restore-keys, so a
      # changed version never reuses an old browser.
      - name: Read Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('./node_modules/@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Restore Chromium cache
        id: playwright-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: node_modules/.bin/playwright install --with-deps chromium

      # Saved right after the install, so a later failing check does not discard the download.
      - name: Save Chromium cache
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Chromium system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: node_modules/.bin/playwright install-deps chromium

      - name: Site checks
        run: npm run check

      # Its own step: a third-party outage shows up as this step failing, not as a broken site.
      - name: External links
        run: npm run check:external
